name: iOS build and TestFlight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app
        run: |
          xcodebuild -project 'tournaments/Tournament Management.xcodeproj' \
            -scheme tournaments -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  testflight:
    if: github.event_name != 'pull_request'
    needs: simulator-build
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: 57VY4JK4N8
      APP_BUNDLE_ID: saro.tournamentsManagement
      CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        run: |
          for key in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_PRIVATE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "Missing GitHub secret for $key" >&2
              exit 1
            fi
          done
      - name: Install signing assets
        run: |
          echo "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain
          security list-keychains -d user -s build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
      - name: Archive
        run: |
          xcodebuild -project 'tournaments/Tournament Management.xcodeproj' \
            -scheme tournaments -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TournamentManagement.xcarchive" \
            CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>$APP_BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TournamentManagement.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f "$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name "*.ipa" -print -quit)" \
            --api-key "$ASC_API_KEY_ID" --api-issuer "$ASC_API_ISSUER_ID"
